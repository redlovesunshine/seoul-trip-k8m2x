<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>首爾賞楓醫美購物團</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="首爾行程書">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="首爾 5 天 4 夜互動行程書">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: 單欄手機優先，上方日期膠囊吸頂，下方四個分頁；點任一地點從底部滑出攻略面板 */
:root{
  --bg:#FCF9F7; --card:#FFFFFF; --ink:#3E3640; --sub:#8A7F86; --line:#F1E8E5; --chip:#F6EFEC;
  --accent:#E9856F; --accent-soft:#FDEBE5; --on-accent:#FFFFFF;
  --butter:#D99A2B; --butter-s:#FCF1D9;
  --rose:#D26C95; --rose-s:#FBE6EE;
  --sage:#5E9A74; --sage-s:#E5F2EA;
  --sky:#5A98C4; --sky-s:#E4F0F9;
  --lav:#8D7BC0; --lav-s:#EDE8F8;
  --shadow:0 6px 24px rgba(120,80,70,.08);
  --f-body:'Huninn','jf-openhuninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:ui-rounded,'Huninn',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1A1D; --card:#2A2529; --ink:#F3EBEE; --sub:#B0A4AB; --line:#3A3338; --chip:#352F33;
  --accent:#F09A86; --accent-soft:#44302D; --on-accent:#2A1A16;
  --butter:#EDB555; --butter-s:#43391F;
  --rose:#EE8DB0; --rose-s:#47303A;
  --sage:#7FBE95; --sage-s:#26382E;
  --sky:#7DB6DE; --sky-s:#243543;
  --lav:#B0A0DD; --lav-s:#352F4A;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1A1D; --card:#2A2529; --ink:#F3EBEE; --sub:#B0A4AB; --line:#3A3338; --chip:#352F33;
  --accent:#F09A86; --accent-soft:#44302D; --on-accent:#2A1A16;
  --butter:#EDB555; --butter-s:#43391F;
  --rose:#EE8DB0; --rose-s:#47303A;
  --sage:#7FBE95; --sage-s:#26382E;
  --sky:#7DB6DE; --sky-s:#243543;
  --lav:#B0A0DD; --lav-s:#352F4A;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.c-sight{--c:var(--butter);--cs:var(--butter-s)}
.c-bakery{--c:var(--butter);--cs:var(--butter-s)}
.c-cafe{--c:var(--rose);--cs:var(--rose-s)}
.c-food{--c:var(--accent);--cs:var(--accent-soft)}
.c-shop{--c:var(--lav);--cs:var(--lav-s)}
.c-beauty{--c:var(--rose);--cs:var(--rose-s)}
.c-move{--c:var(--sky);--cs:var(--sky-s)}
.c-stay{--c:var(--sage);--cs:var(--sage-s)}

/* app bar */
.bar{display:block;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:6px}
.barrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar h1{font-size:clamp(16px,5.2vw,19px);line-height:1.3;white-space:nowrap;min-width:0}
.bar small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.barbtns{display:flex;gap:6px;flex:0 0 auto}
.pill-btn{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}
.hero{position:relative;border-radius:24px;overflow:hidden;margin:8px 0 14px;box-shadow:var(--shadow);background:var(--chip)}
.hero img{display:block;width:100%;height:150px;object-fit:cover;object-position:50% 60%}
.hero .hc{position:absolute;inset:auto 0 0 0;padding:34px 16px 12px;background:linear-gradient(transparent,rgba(40,25,30,.62));color:#fff}
.hero .hc b{font-size:17px}.hero .hc span{display:block;font-size:12.5px;opacity:.92}
.count{display:inline-block;background:rgba(255,255,255,.9);color:#7a4a3f;border-radius:999px;padding:2px 10px;font-size:12px;position:absolute;top:12px;left:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fact{background:var(--card);border-radius:18px;padding:11px 13px;box-shadow:var(--shadow);min-width:0}
.fact small{color:var(--sub);font-size:12px;display:block}
.fact b{font-size:14px;display:block}
.fact.wide{grid-column:1/-1}

/* day pills */
.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:66px;background:var(--card);border-radius:18px;padding:7px 10px;text-align:center;box-shadow:var(--shadow);line-height:1.25}
.day .e{font-size:19px;display:block}.day b{font-size:13px;display:block}.day small{font-size:11px;color:var(--sub)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] small{color:inherit;opacity:.9}
.dayhead{margin:16px 0 8px}
.dayhead h2{font-size:21px;line-height:1.35;text-wrap:balance}
.dayhead p{color:var(--sub);font-size:13.5px;margin-top:2px}
.wx{display:flex;align-items:center;gap:10px;background:var(--sky-s);border-radius:16px;padding:9px 13px;margin:10px 0 4px;font-size:13px}
.wx .t{font-size:17px;color:var(--sky);white-space:nowrap}
.wx span{min-width:0}

/* timeline */
.tl{list-style:none;margin:8px 0 0;padding:0}
.st{display:grid;grid-template-columns:58px 18px 1fr;gap:0 6px;align-items:stretch}
.st .tm{font-size:12.5px;color:var(--sub);padding-top:13px;text-align:right;line-height:1.3}
.st .rail{position:relative}
.st .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.st:first-child .rail::before{top:20px}.st:last-child .rail::before{bottom:calc(100% - 20px)}
.st .dot{position:absolute;left:50%;top:15px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-sizing:content-box}
.st .cd{margin:5px 0 8px;background:var(--card);border-radius:18px;padding:11px 12px;box-shadow:var(--shadow);text-align:left;width:100%;display:block;min-width:0}
.cd .tt{display:flex;gap:8px;align-items:flex-start}
.cd .tt b{font-size:15.5px;line-height:1.4;flex:1;min-width:0}
.cd .ds{color:var(--sub);font-size:13px;margin-top:2px}
.cd .mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--cs,var(--chip));color:var(--c,var(--sub));border-radius:999px;padding:2px 10px;font-size:12px;line-height:1.6}
.chip.go{background:var(--chip);color:var(--sub)}
.tag{display:inline-block;border-radius:999px;font-size:11px;padding:0 8px;background:var(--cs);color:var(--c);vertical-align:1px;margin-left:6px;line-height:1.7}
.tag.f{background:var(--rose-s);color:var(--rose)}
.tag.m{background:var(--chip);color:var(--ink)}
.tag.x{background:var(--butter-s);color:var(--butter)}
.story h4{font-size:14px;margin:12px 0 2px;color:var(--ink)}
.story p{font-size:14px;color:var(--ink);margin:0}
.rtl{position:relative;padding-left:46px;margin-top:10px}
.rtl::before{content:"";position:absolute;left:17px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--accent-soft)}
.rn{position:relative;margin:0 0 6px}
.rn .dt{position:absolute;left:-46px;top:0;width:38px;height:38px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px}
.rn.end .dt{background:var(--accent);border-color:var(--accent)}
.rn h4{margin:6px 0 4px;font-size:15.5px}
.rn .nd{font-size:13px;color:var(--sub);margin-bottom:6px}
.rw{position:relative;margin:2px 0 14px;font-size:12px;color:var(--sub)}
.rw span{background:var(--chip);border-radius:999px;padding:2px 10px}
.rn .row{margin-bottom:8px}
.pins{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.pinchip{background:var(--butter-s);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;text-align:left}
.pinlab{font-size:12px;color:var(--sub);margin-top:2px}
.wtabs{display:flex;gap:8px;margin:8px 0}
.wtabs .fc{flex:1;text-align:center;padding:9px}
.more{color:var(--accent);font-size:12.5px;margin-top:6px;display:block}
.ex{margin:14px 0 4px}
.ex h3{font-size:15px;margin-bottom:8px}
.exs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.exs::-webkit-scrollbar{display:none}
.xc{flex:0 0 220px;background:var(--butter-s);border-radius:18px;padding:11px 13px;text-align:left}
.xc b{font-size:14.5px;display:block}.xc p{font-size:12.5px;color:var(--sub);margin-top:2px}
.note{border-radius:20px;padding:13px 15px;margin:12px 0;font-size:13.5px;background:var(--accent-soft)}
.note h3{font-size:15px;margin-bottom:4px}
.note.sage{background:var(--sage-s)}.note.sky{background:var(--sky-s)}.note.lav{background:var(--lav-s)}.note.butter{background:var(--butter-s)}.note.rose{background:var(--rose-s)}
.note p+p{margin-top:4px}
.daynav{display:flex;gap:10px;margin:14px 0}
.daynav button{flex:1;background:var(--card);border-radius:16px;padding:11px;box-shadow:var(--shadow);font-size:14px}

/* rows */
.row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:10px 10px 10px 12px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer}
.row .ico{flex:0 0 38px;height:38px;border-radius:13px;background:var(--cs);display:grid;place-items:center;font-size:19px}
.row .rb{flex:1;min-width:0}
.row .rt{font-size:15px;line-height:1.4}
.row .rd{font-size:12.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .ra{display:flex;gap:4px}
.ib{width:36px;height:36px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:16px}
.ib.on{background:var(--butter-s)}

/* search */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 4px}
.search label{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;padding:13px 0;min-width:0;outline:0}
.search input::placeholder{color:var(--sub)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .x{color:var(--sub);padding:6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;box-shadow:var(--shadow)}
.fc[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cnt{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12.5px;margin:10px 2px}
.empty{text-align:center;color:var(--sub);padding:34px 10px}
.empty b{display:block;font-size:34px}

/* guides */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;min-width:0}
.tile .e{font-size:26px;display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--cs);margin-bottom:8px}
.tile b{display:block;font-size:15px}.tile small{color:var(--sub);font-size:12.5px;display:block;line-height:1.45}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--sub);padding:14px 0 4px;font-size:14px}
.g h2{font-size:23px;line-height:1.35;margin:4px 0 4px}
.g .lead{color:var(--sub);font-size:14px;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin:9px 0;font-size:14px}
.steps li::before{content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;background:var(--c,var(--accent));color:var(--on-accent);display:grid;place-items:center;font-size:12.5px;margin-top:2px}
.steps li>span{min-width:0}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin:12px 0}
.card h3{font-size:15.5px;margin-bottom:6px}
.addr{display:flex;gap:10px;align-items:center;background:var(--chip);border-radius:16px;padding:10px 12px;margin:8px 0}
.addr div{flex:1;min-width:0;font-size:14px;line-height:1.5;word-break:break-word}
.addr small{color:var(--sub);display:block;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:9px 14px;font-size:14px}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line)}
.kr:first-of-type{border-top:0}
.kr div{min-width:0;flex:1}.kr b{display:block;font-size:15px;line-height:1.5}.kr small{color:var(--sub);font-size:12.5px}
select{width:100%;font:inherit;background:var(--chip);color:var(--ink);border:0;border-radius:14px;padding:10px 12px;margin-top:6px}
.line{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:13.5px}
.line:first-of-type{border-top:0}
.ln{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}
.l2{background:#4C9A68}.l3{background:#E58F3B}.l4{background:#4A78B8}
.line div{min-width:0}.lA{background:#3B7DDD;font-size:12px}
.l水{background:#E4B100;font-size:12px}
.line b{display:block}.line span{color:var(--sub)}
.img{width:100%;border-radius:18px;display:block;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span{color:var(--sub)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);font-size:14px;cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto}
.chk.done span{text-decoration:line-through;color:var(--sub)}
.sec{font-size:13px;color:var(--sub);margin:18px 2px 6px;letter-spacing:.06em}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 6px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 0;border-radius:16px;font-size:11.5px;color:var(--sub);line-height:1.35}
.nav button span{font-size:21px;line-height:1.2}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet + overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(40,25,30,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:88%;transform:translateY(105%);transition:transform .25s ease;display:flex;justify-content:center;pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.sheet .in{width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;overflow-y:auto;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 24px);max-height:88dvh}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
.sh h2{font-size:21px;line-height:1.35;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sh .sub{color:var(--sub);font-size:13px}
.sh .close{background:var(--chip);width:34px;height:34px;border-radius:50%;flex:0 0 auto}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.act{background:var(--card);border-radius:16px;padding:9px 2px;box-shadow:var(--shadow);font-size:12px;line-height:1.35;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.act span{font-size:22px}
.sh h3.s{font-size:14px;color:var(--sub);margin:16px 2px 8px}
.why{background:var(--butter-s);border-radius:14px;padding:8px 12px;font-size:13px;margin:8px 0}
.drv{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.drv.on{display:flex}
.drv .big{font-size:clamp(26px,8vw,40px);line-height:1.35;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.drv .mid{font-size:clamp(20px,6vw,28px);line-height:1.45;margin-top:12px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);z-index:100;background:#3E3640;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:360px){.acts{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:1fr}}
</style>


</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="barrow"><h1>🍁 首爾賞楓醫美購物團</h1>
      <div class="barbtns"><button class="pill-btn" id="btnRefresh" aria-label="重新整理，載入最新版" title="重新整理">🔄</button><button class="pill-btn" id="btnAdd" aria-label="加入主畫面" title="加入主畫面">📲</button></div></div>

/* 旅行日判斷 */
function tripState(){
  const now=new Date(),d0=new Date(2026,10,4),d1=new Date(2026,10,8);
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((d0-t)/864e5);
  if(diff>0)return {txt:'出發倒數 '+diff+' 天',day:1};
  const idx=Math.round((t-d0)/864e5);
  if(t<=d1)return {txt:'旅行第 '+(idx+1)+' 天',day:idx+1};
  return {txt:'旅程結束，歡迎回家',day:1};
}

 <div class="card"><h3>📋 常用金額速查</h3><div id="fxTab">${fxTable()}</div></div>
 <div class="note butter"><p>🧾 一般購物 <b>₩15,000</b> 起可退稅，約 NT$ <span id="fxTax">${fmt(15000/r)}</span>。</p></div></div>`};
function fxCalc(from){
  const r=fxRate(),K=$('#fxK'),T=$('#fxT');if(!K)return;
  if(from==='k'){const v=parseFloat(K.value);T.value=isFinite(v)?String(Math.round(v/r*10)/10):''}
  else if(from==='t'){const v=parseFloat(T.value);K.value=isFinite(v)?String(Math.round(v*r)):''}
  const k=parseFloat(K.value),n=+$('#fxN').value||1;
  $('#fxEach').textContent=isFinite(k)?'₩'+fmt(k/n)+' ≈ NT$ '+fmt(k/n/r,1):'—';
}

  openSheet(`<h2><span>📲 加入手機主畫面</span><button class="close" data-close aria-label="關閉">✕</button></h2>
   <p class="sub">每位旅伴各自操作一次，之後就像 App 一樣一點就開。</p>
   <div class="card"><h3>🍎 iPhone（Safari）</h3><ol class="steps"><li><span>用 <b>Safari</b> 開啟行程書連結（LINE 內建瀏覽器不能加）。</span></li><li><span>點下方中間的 <b>分享 ⬆️</b>。</span></li><li><span>往下滑，選 <b>「加入主畫面」</b>。</span></li><li><span>名稱可改成「首爾行程」，按右上 <b>新增</b>。</span></li></ol></div>
   <div class="card"><h3>🤖 Android（Chrome）</h3><ol class="steps"><li><span>用 Chrome 開啟連結。</span></li><li><span>點右上 <b>⋮</b> → <b>「加到主畫面」</b>或「安裝應用程式」。</span></li></ol></div>
   <div class="card"><h3>🔗 傳給旅伴</h3><div class="addr"><div style="font-size:12.5px">${esc(url||'請複製瀏覽器網址列的連結')}</div><button class="btn sm" data-copytext="${esc(url)}" data-msg="✓ 已複製連結">📋 複製連結</button></div>
   <p style="color:var(--sub);font-size:12.5px">旅伴需要能開啟這個連結才看得到。收藏與勾選只會存在各自的手機。</p></div>`);
}

/* ============ 路由與渲染 ============ */
function route(){
  const h=location.hash.slice(1)||'plan';
  const view=$('#view');
  let tab='plan';
  if(h.startsWith('g-')){tab='guides';view.innerHTML=(G[h]||(()=>viewGuides()))();}
  else if(h==='explore'){tab='explore';view.innerHTML=viewExplore();results();}
  else if(h==='guides'){tab='guides';view.innerHTML=viewGuides();}
  else if(h==='me'){tab='me';view.innerHTML=viewMe();}
  else {view.innerHTML=viewPlan();}
  S.tab=tab;
  document.querySelectorAll('.nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go===tab));
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.go===tab)b.setAttribute('aria-current','page')});
  closeSheet();$('#drv').classList.remove('on');
}
async function hardRefresh(){
  toast('🔄 更新中，載入最新版…');
  try{const rs=(navigator.serviceWorker&&await navigator.serviceWorker.getRegistrations())||[];for(const r of rs)await r.unregister();
    const ks=(window.caches&&await caches.keys())||[];for(const k of ks)await caches.delete(k)}catch(e){}
  setTimeout(()=>location.reload(),300);
}
function go(h){window.scrollTo(0,0);if(location.hash.slice(1)===h)route();else location.hash=h;}
function refresh(keepScroll){const y=window.scrollY;route();if(keepScroll)window.scrollTo(0,y)}
addEventListener('hashchange',()=>{window.scrollTo(0,0);route()});

document.addEventListener('click',e=>{
  const t=e.target;
  const q=s=>t.closest(s);
  if(q('a[href]'))return;
  let el;
  if(el=q('[data-copytext]')){e.stopPropagation();copy(el.dataset.copytext,el.dataset.msg||'✓ 已複製');return}
  if(el=q('[data-copy]')){e.stopPropagation();copyPlace(PM[el.dataset.copy]);return}
  if(el=q('[data-fav]')){e.stopPropagation();const id=el.dataset.fav;favs=favs.includes(id)?favs.filter(i=>i!==id):[...favs,id];store.set('favs',favs);toast(favs.includes(id)?'⭐ 已加入收藏':'已取消收藏');
    if(q('.sheet'))placeSheet(PM[id]);else if(S.tab==='explore')results();else refresh(true);return}
  if(el=q('[data-term]')){store.set('term',+el.dataset.term);if($('#drv').classList.contains('on'))openDriver(PM.icn);else refresh(true);return}
  if(el=q('[data-act]')){const x=PM[el.dataset.p];const a=el.dataset.act;S.ctx=x.id;
    if(a==='taxi'){closeSheet();openDriver(x)}else if(a==='metro'&&el.dataset.k){showRoute(el.dataset.k)}else go({wow:'g-wow',food:'g-food',metro:'g-metro'}[a]);return}
  if(el=q('[data-backstop]')){stopSheet(SM[el.dataset.backstop]);return}
  if(el=q('[data-driver]')){const x=PM[el.dataset.driver];S.ctx=x.id;openDriver(x);return}
  if(q('#drvClose')){$('#drv').classList.remove('on');return}
  if(q('#drvGuide')){$('#drv').classList.remove('on');go('g-taxi');return}
  if(q('#btnRefresh')){hardRefresh();return}
  if(q('#btnAdd')||q('#btnAdd2')){addHome();return}
  if(q('[data-close]')||t===$('#scrim')){closeSheet();return}
  if(el=q('[data-wtab]')){S.walk=el.dataset.wtab;route();return}
  if(el=q('[data-go]')){if(el.dataset.walk)S.walk=el.dataset.walk;go(el.dataset.go);return}
  if(el=q('[data-day]')){S.day=+el.dataset.day;store.set('day',S.day);refresh();const dd=document.querySelector('.days');if(dd){const y=dd.getBoundingClientRect().top+scrollY;if(scrollY>y)window.scrollTo(0,y)}return}
  if(el=q('[data-stop]')){stopSheet(SM[el.dataset.stop]);return}
  if(el=q('[data-open]')){placeSheet(PM[el.dataset.open]);return}
  if(el=q('[data-fcat]')){S.f.cat=S.f.cat===el.dataset.fcat?'':el.dataset.fcat;syncFilters();return}
  if(el=q('[data-fday]')){const n=+el.dataset.fday;S.f.day=S.f.day===n?0:n;syncFilters();return}
  if(el=q('[data-fkind]')){S.f.kind=S.f.kind===el.dataset.fkind?'':el.dataset.fkind;syncFilters();return}
  if(el=q('[data-fmeat]')){S.f.meat=S.f.meat===el.dataset.fmeat?'':el.dataset.fmeat;syncFilters();return}
  if(q('[data-ffav]')){S.f.fav=!S.f.fav;syncFilters();return}
  if(q('#fclear')){S.f={q:'',cat:'',day:0,kind:'',fav:false,meat:''};route();return}
  if(q('#qx')){S.f.q='';route();$('#q').focus();return}
});
function syncFilters(){
  document.querySelectorAll('[data-fcat]').forEach(b=>b.setAttribute('aria-pressed',S.f.cat===b.dataset.fcat));
  document.querySelectorAll('[data-fday]').forEach(b=>b.setAttribute('aria-pressed',S.f.day===+b.dataset.fday));
  document.querySelectorAll('[data-fkind]').forEach(b=>b.setAttribute('aria-pressed',S.f.kind===b.dataset.fkind));
  document.querySelectorAll('[data-fmeat]').forEach(b=>b.setAttribute('aria-pressed',S.f.meat===b.dataset.fmeat));
  document.querySelectorAll('[data-ffav]').forEach(b=>b.setAttribute('aria-pressed',S.f.fav));
  results();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.f.q=t.value;$('#qx').hidden=!t.value;results()}
  if(t.id==='fxK')fxCalc('k');
  if(t.id==='fxT')fxCalc('t');
  if(t.id==='fxRate'){const v=parseFloat(t.value);if(v>0){store.set('rate',v);$('#fxTab').innerHTML=fxTable();$('#fxTax').textContent=fmt(15000/v);fxCalc($('#fxK').value?'k':'t')}}
  if(t.id==='wq'){const v=t.value.trim().toLowerCase();document.querySelectorAll('.wowrow').forEach(r=>r.hidden=v&&!r.dataset.area.toLowerCase().includes(v))}
  if(t.dataset&&t.dataset.chk){checks[t.dataset.chk]=t.checked;store.set('checks',checks);t.closest('.chk').classList.toggle('done',t.checked);const done=LIST.filter(l=>checks[l[0]]).length;const s=document.querySelector('.sec');if(s)s.textContent='出發前確認　'+done+'/'+LIST.length}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fxN'){fxCalc()}
  if(e.target.id==='destSel'){S.ctx=e.target.value;route()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();$('#drv').classList.remove('on')}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}
});

/* 主畫面圖示（執行時用 canvas 產生） */

route();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
